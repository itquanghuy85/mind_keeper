<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Nền bo tròn -->
  <rect width="1024" height="1024" rx="230" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Hình não stylized (vùng bên trái) -->
  <path d="M320 420 C260 420 220 460 220 520 C220 580 260 620 320 620 C380 620 420 580 420 520 C420 460 380 420 320 420 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M320 380 C290 380 270 400 270 430 C270 460 290 480 320 480 C350 480 370 460 370 430 C370 400 350 380 320 380 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M370 440 C350 440 340 460 340 480 C340 500 350 520 370 520 C390 520 400 500 400 480 C400 460 390 440 370 440 Z" fill="#FFFFFF" opacity="0.85"/>
  <!-- Ổ khóa (vùng bên phải) -->
  <circle cx="680" cy="560" r="90" fill="#FFFFFF" opacity="0.95"/>
  <rect x="640" y="560" width="80" height="140" rx="20" fill="#FFFFFF" opacity="0.95"/>
  <!-- Cylinder lỗ khóa -->
  <ellipse cx="680" cy="560" rx="30" ry="20" fill="#1E3A8A"/>
  <ellipse cx="680" cy="560" rx="14" ry="10" fill="#FFFFFF" opacity="0.6"/>
  <!-- Đường kết nối não ↔ khóa (dây thần kinh) -->
  <path d="M420 520 Q520 480 620 540" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M420 520 Q500 560 620 580" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
