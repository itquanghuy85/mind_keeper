name: mind_keeper
description: "MindKeeper AI - hoc tap va nho lai theo duong cong tri nho."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  http: ^1.6.0
  intl: ^0.20.3
  fsrs: ^2.0.1
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  google_mlkit_text_recognition: ^0.16.0
  syncfusion_flutter_pdf: ^35.1.40+1
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  image: ^4.12.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_background: "#0F172A"
  adaptive_foreground: "assets/images/app_icon_adaptive.png"
  remove_alpha_ios: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
