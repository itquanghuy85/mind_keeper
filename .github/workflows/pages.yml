name: Publish site (privacy policy)

# Đăng thư mục site/ lên GitHub Pages.
# Cần đặt Repository variables: CONTACT_EMAIL, DEVELOPER_NAME
# (Settings → Secrets and variables → Actions → Variables) và bật
# Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [master, main]
    paths: ["site/**", "tool/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          DEVELOPER_NAME: ${{ vars.DEVELOPER_NAME }}
        run: bash tool/site/build_site.sh build_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build_site
      - id: deployment
        uses: actions/deploy-pages@v4
